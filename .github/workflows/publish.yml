name: publish

# Builds the image and pushes it to GitHub's container registry, so TrueNAS
# only ever has to pull a tag - no source checkout and no building on the NAS.
#
# Tags produced:
#   main branch  -> :latest and :main-<sha>
#   git tag v1.2 -> :v1.2, :1.2, :1 and :latest
#
# The package is private by default. Either make it public (Packages ->
# orbit -> Package settings -> Change visibility) or log TrueNAS in with a
# read:packages token. See README section 8.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-{{sha}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # TrueNAS SCALE and Mint are both x86-64. Adding linux/arm64 here
          # works but is slow, because scipy and opencv build under emulation.
          platforms: linux/amd64
