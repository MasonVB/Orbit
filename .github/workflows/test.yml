name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt httpx

      - name: Syntax check
        run: |
          python -m compileall -q app smoke_test.py
          python -c "import json; json.load(open('app/calibrations/insta360_x5.json'))"

      - name: Smoke test
        run: python smoke_test.py

      # Real .insp / .360 files are too large to keep in git. To test the media
      # pipeline in CI, upload samples as a release asset or to object storage
      # and fetch them here, then pass the paths to smoke_test.py.

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t orbit:ci .
      - name: Check it starts
        run: |
          docker run --rm -d --name orbit-ci -p 8080:8080 \
            -e ORBIT_ADMIN_PASSWORD=citest orbit:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then ok=1; break; fi
            sleep 2
          done
          docker logs orbit-ci
          docker stop orbit-ci
          test -n "$ok"
